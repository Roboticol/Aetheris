           C 107.5 103.8, 103 108.5, 98 105.5
           C 85 97.5, 77 46, 64 46
           C 51 46, 43 97.5, 30 105.5
           C 25 108.5, 20.5 103.8, 23 99
           C 34 78, 51 44, 64 20 Z"
        fill="url(#c1-arch)" />

  <!-- Cursor-inspired Left Facet Highlight -->
  <path d="M 64 20
           C 51 44, 34 78, 23 99
           C 20.5 103.8, 25 108.5, 30 105.5
           C 43 97.5, 51 46, 64 46 Z"
        fill="#FFFFFF" fill-opacity="0.22" />

  <!-- Claude-inspired Warm Agentic Spark -->
  <path d="M 64 68
           Q 66.5 80.5 79 83
           Q 66.5 85.5 64 98
           Q 61.5 85.5 49 83
           Q 61.5 80.5 64 68 Z"
        fill="url(#c1-spark)" />
