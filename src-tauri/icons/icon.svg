<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="c1-bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131624" />
      <stop offset="100%" stop-color="#090A10" />
    </linearGradient>
    <linearGradient id="c1-border" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="c1-arch" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="c1-spark" x1="64" y1="68" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#E06D53" />
    </linearGradient>
  </defs>

  <!-- App Icon Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#c1-bg)" stroke="url(#c1-border)" stroke-width="1.5" />

  <!-- Levitating A-Arch -->
  <path d="M 64 20
